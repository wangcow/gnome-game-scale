<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="big" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.42" stop-color="#2d84f0"/>
      <stop offset="1" stop-color="#124eae"/>
    </linearGradient>
    <linearGradient id="small" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e7eef6"/>
      <stop offset="1" stop-color="#b7c6d8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#102033" flood-opacity="0.38"/>
    </filter>
    <clipPath id="big-clip">
      <rect x="148" y="28" width="332" height="332" rx="76"/>
    </clipPath>
    <clipPath id="small-clip">
      <rect x="32" y="248" width="176" height="176" rx="44"/>
    </clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="148" y="28" width="332" height="332" rx="76" fill="url(#big)"/>
    <rect x="32" y="248" width="176" height="176" rx="44" fill="url(#small)"/>
  </g>
  <g clip-path="url(#big-clip)">
    <rect x="168" y="40" width="292" height="118" rx="58" fill="url(#shine)"/>
  </g>
  <g clip-path="url(#small-clip)">
    <rect x="48" y="258" width="144" height="58" rx="28" fill="url(#shine)"/>
  </g>
  <!-- Arrow from the small tile up into the large tile. -->
  <path fill="#0c3f86" d="M238.7 261.7 L310.5 193.1 L332.6 216.2 L356.0 104.0 L247.0 118.6 L269.1 141.7 L197.3 210.3 Z"/>
  <path fill="#ffffff" d="M234.7 257.7 L306.5 189.1 L328.6 212.2 L348.0 108.0 L243.0 122.6 L265.1 145.7 L193.3 214.3 Z"/>
